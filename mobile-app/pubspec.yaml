name: raksha_ireland_app
description: Emergency alert system for immigrants and residents in Ireland

# Prevent accidental publishing to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # HTTP and API
  dio: ^5.3.2
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # Authentication
  firebase_auth: ^4.12.1
  firebase_core: ^2.17.0
  
  # Push Notifications
  firebase_messaging: ^14.7.3
  flutter_local_notifications: ^16.1.0
  
  # Location Services
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Networking
  connectivity_plus: ^5.0.1
  
  # Utils
  intl: ^0.18.1
  uuid: ^4.1.0
  
  # UI Enhancements
  flutter_svg: ^2.0.8
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Animation
  lottie: ^2.7.0
  
  # Permissions
  permission_handler: ^11.0.1
  
  # Widget Extensions
  home_widget: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.4
  json_serializable: ^6.7.1
  
  # Code Quality
  flutter_lints: ^3.0.1
  
  # Testing
  mockito: ^5.4.2

# For information on the generic Dart part of this file, see:
# https://dart.dev/tools/pub/pubspec
flutter:
  uses-material-design: true

  # Assets
  # assets:
