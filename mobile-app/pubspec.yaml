name: raksha_ireland_app
description: Emergency alert system for immigrants and residents in Ireland

# Prevent accidental publishing to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # HTTP and API
  dio: ^5.3.2
  http: ^1.1.0
  http_parser: ^4.0.2
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # Authentication
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  firebase_storage: ^13.0.4
  
  # Push Notifications
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0
  
  # Location Services
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.5.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Networking
  connectivity_plus: ^7.0.0
  
  # Utils
  intl: ^0.20.2
  uuid: ^4.1.0
  
  # UI Enhancements
  flutter_svg: ^2.0.8
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Animation
  lottie: ^3.3.2
  
  # Permissions
  permission_handler: ^12.0.1
  
  # Image Picker
  image_picker: ^1.0.5
  
  # Widget Extensions
  home_widget: ^0.8.1

  # URL launch for external intents (Google Maps)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.10.4
  retrofit_generator: ^10.2.0
  json_serializable: ^6.11.3
  
  # Code Quality
  flutter_lints: ^6.0.0
  
  # Testing
  mockito: ^5.6.1

# For information on the generic Dart part of this file, see:
# https://dart.dev/tools/pub/pubspec
flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/localization/

  # Fonts - Commented out for now, will use system fonts
